<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12204A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bharat Cloud Shiksha | Sign in</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="login.css">
<script src="loader.js" defer></script>
</head>
<body>
<main class="lg" id="lg">
 <div class="orb o1"></div><div class="orb o2"></div>
 <section class="lcard" aria-labelledby="lt">
  <img src="logo-login.png" width="96" height="96" alt="Bharat Cloud Shiksha logo">
  <p class="eyebrow">BHARAT CLOUD SHIKSHA</p>
  <h1 id="lt">AI/ML Literacy Series</h1>
  <p class="sub">From Mandi to Model: your Google Cloud ML journey</p>
  <form id="lf" autocomplete="off" novalidate>
   <label for="pw">Enter your access password (case-sensitive)</label>
   <div class="pwrow"><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Password" required><button type="button" id="eye" aria-label="Show password">Show</button></div>
   <button class="go" id="go" type="submit">Unlock the course</button>
   <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
  </form>
  <p class="fine">Seekho. Banao. Certify.<br>Independent learning content, not affiliated with Google.</p>
 </section>
 <noscript><p class="msg">JavaScript is required to open this course.</p></noscript>
</main>
</body>
</html>
